<title>Poco a Poco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one narrow phone column (max 560px); views swap in place like an app. The azulejo tile band is the one bold element, on the home screen only. */
:root{
  --paper:#eef1f8; --card:#ffffff; --ink:#141d45; --muted:#58628a; --line:#d5dbee;
  --cobalt:#2745c4; --on-cobalt:#ffffff; --saffron:#e3961a; --saff-soft:#fbe8c4;
  --good:#1b7f51; --good-soft:#d9efe3; --bad:#bb3a2a; --bad-soft:#f7dcd6; --warn:#8f6206; --warn-soft:#f5eacb;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0c1124; --card:#151c37; --ink:#e6eaf8; --muted:#9aa3c8; --line:#283157;
  --cobalt:#7d95ff; --on-cobalt:#0c1124; --saffron:#f2b443; --saff-soft:#3b3018;
  --good:#52c48e; --good-soft:#12321f; --bad:#f2806e; --bad-soft:#3a1d19; --warn:#e5b850; --warn-soft:#342a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1124; --card:#151c37; --ink:#e6eaf8; --muted:#9aa3c8; --line:#283157;
  --cobalt:#7d95ff; --on-cobalt:#0c1124; --saffron:#f2b443; --saff-soft:#3b3018;
  --good:#52c48e; --good-soft:#12321f; --bad:#f2806e; --bad-soft:#3a1d19; --warn:#e5b850; --warn-soft:#342a12; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;box-sizing:border-box;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px;
  display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.bar h2{flex:1;font-size:20px;font-weight:600;min-width:0}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:22px;height:22px}
.chips{display:flex;gap:6px;font-variant-numeric:tabular-nums}
.chip{font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.chip.new{color:var(--cobalt)} .chip.lrn{color:var(--bad)} .chip.rev{color:var(--good)}

.btn{font-weight:700;font-size:17px;border:0;border-radius:14px;padding:13px 18px;min-height:52px;background:var(--cobalt);color:var(--on-cobalt);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.line{background:transparent;color:var(--cobalt);border:1.5px solid var(--line)}
.btn.plain{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.grow{flex:1 1 140px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:15px}

/* home */
.tiles{height:64px;border-radius:16px;background-color:var(--cobalt);
  background-image:
   radial-gradient(circle at 50% 50%,var(--saffron) 0 3.5px,transparent 4.5px),
   radial-gradient(circle at 50% 50%,transparent 0 8px,var(--on-cobalt) 8.5px 9.5px,transparent 10px),
   radial-gradient(circle at 0 0,var(--paper) 0 7px,transparent 7.5px),
   radial-gradient(circle at 100% 0,var(--paper) 0 7px,transparent 7.5px),
   radial-gradient(circle at 0 100%,var(--paper) 0 7px,transparent 7.5px),
   radial-gradient(circle at 100% 100%,var(--paper) 0 7px,transparent 7.5px);
  background-size:32px 32px;background-position:center}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand h1 .tilde{color:var(--saffron)}
.tag{color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font:800 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.act h3{font-size:24px;font-weight:600}
.act .meta{display:flex;gap:8px;flex-wrap:wrap}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:15px}

/* flashcards */
.prompt{align-items:flex-start}
.prompt .en{font:600 32px/1.15 var(--f-display)}
.prompt .ctx{color:var(--muted);font-style:italic}
.cloze{font-size:18px}
.ansbox{display:flex;flex-direction:column;gap:10px}
#ans{font:400 24px var(--f-body);width:100%;box-sizing:border-box;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
#ans:focus{border-color:var(--cobalt);outline:none}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{width:42px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:19px;cursor:pointer}
.links{display:flex;gap:18px;flex-wrap:wrap}
.links button{background:none;border:0;padding:6px 0;color:var(--cobalt);font-weight:700;cursor:pointer}
.res{border-radius:14px;padding:12px 14px;font-weight:700}
.res .note{font-weight:400;display:block;margin-top:2px}
.res.right{background:var(--good-soft);color:var(--good)}
.res.almost{background:var(--warn-soft);color:var(--warn)}
.res.wrong{background:var(--bad-soft);color:var(--bad)}
.res .you{font-weight:400;text-decoration:line-through}
.answer{display:flex;align-items:center;gap:12px}
.answer .es{font:800 34px/1.1 var(--f-display);flex:1;min-width:0;overflow-wrap:anywhere}
.answer .alts{display:block;font:400 16px var(--f-body);color:var(--muted);margin-top:4px}
.say{display:flex;gap:10px;align-items:flex-start}
.say p{flex:1;min-width:0}
.say .es-s{font-size:19px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;justify-content:center}
.rate b{font-size:16px}
.rate span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rate.r1 b{color:var(--bad)} .rate.r2 b{color:var(--warn)} .rate.r3 b{color:var(--good)} .rate.r4 b{color:var(--cobalt)}
.rate.def{border-color:var(--saffron);box-shadow:0 0 0 2px var(--saffron) inset}

/* listening */
.speeds{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.speeds button{border:0;background:none;padding:9px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.speeds button+button{border-left:1px solid var(--line)}
.speeds button b{font-size:15px}
.speeds button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.speeds button.on{background:var(--cobalt);color:var(--on-cobalt)}
.speeds button.on span{color:var(--on-cobalt);opacity:.8}
.player{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0}
.playbig{width:92px;height:92px;border-radius:50%;border:0;background:var(--cobalt);color:var(--on-cobalt);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 -2px var(--saffron)}
.playbig svg{width:40px;height:40px;margin-left:5px}
.playbig.speaking{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.95)}}
@media (prefers-reduced-motion: reduce){.playbig.speaking{animation:none}}
.side{display:flex;flex-direction:column;gap:8px;align-items:center}
.side .btn{width:96px;padding:8px;font-size:14px;min-height:44px}
.words{display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:12px;font-size:21px;line-height:1.2;padding:4px 0}
.w{border:0;background:none;padding:4px 3px 3px;border-radius:8px;cursor:pointer;border-bottom:2.5px solid var(--line);font-size:inherit;min-height:34px;transition:background .15s}
.w.blank{color:transparent;user-select:none}
.w.on{background:var(--saff-soft)}
.w.ok{color:var(--good);border-bottom-color:var(--good)}
.w.miss{color:var(--bad);border-bottom-color:var(--bad);border-bottom-style:dashed}
.lk{width:13px;height:9px;margin:0 -2px 6px;flex:none;align-self:flex-end;border:2.5px solid transparent;border-top:0;border-radius:0 0 10px 10px}
.lk.l2{border-color:var(--saffron)}
.lk.l1{border-color:var(--muted);border-style:dotted;border-top:0}
.gap{width:10px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:8px;border:2.5px solid var(--saffron);border-top:0;border-radius:0 0 10px 10px;margin-right:5px;vertical-align:middle}
.legend i.l1{border-color:var(--muted);border-style:dotted;border-top:0}
.explain{font-size:15px;color:var(--muted);background:var(--paper);border-radius:12px;padding:10px 12px}
.trans{font-style:italic;color:var(--muted)}
#dict{font:400 20px var(--f-body);width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:none}
#dict:focus{border-color:var(--cobalt);outline:none}
.score{font-weight:700}
.added{font-size:15px;background:var(--saff-soft);border-radius:12px;padding:10px 12px}
.lrates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* settings */
.field{display:flex;flex-direction:column;gap:6px}
.field select{font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:11px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--cobalt);color:var(--on-cobalt)}
#backup{font:13px/1.4 ui-monospace,Menlo,monospace;width:100%;box-sizing:border-box;min-height:90px;border-radius:12px;border:1px solid var(--line);padding:10px;background:var(--paper);color:var(--ink)}
.danger{color:var(--bad)}
.btn.dangerbtn{background:var(--bad);color:var(--card)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;z-index:20;max-width:calc(100% - 48px)}
.done{align-items:center;text-align:center;padding-block:28px}
.done h2{font-size:30px}
</style>
<div id="app"></div>
